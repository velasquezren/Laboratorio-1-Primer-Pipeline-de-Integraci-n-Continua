name: Pipeline CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "         PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Evento:      ${{ github.event_name }}"
          echo "Rama/Ref:    ${{ github.ref_name }}"
          echo "Commit SHA:  ${{ github.sha }}"
          echo "================================"

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Simulacion de prueba o validacion
        run: |
          echo "Ejecutando validacion de compilacion/pruebas..."
          echo "ERROR: Fallo simulado para validar la regla de proteccion de rama y bloqueo de PR."
          exit 1

      - name: Finalizar pipeline
        run: echo "Pipeline ejecutado correctamente."
